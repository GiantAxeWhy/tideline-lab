  <!-- Steam Puff from Exhaust Pipe -->
  <path d="M44 42 C34 26 48 14 60 22 C68 12 82 22 72 34 C66 42 54 44 44 42 Z" fill="#d8e8f5" opacity="0.72" stroke="#0d0a12" stroke-width="3.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="stBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe59e"/><stop offset="50%" stop-color="#cc8a28"/><stop offset="100%" stop-color="#69400c"/></linearGradient>
    <linearGradient id="stIron" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7f8fa6"/><stop offset="55%" stop-color="#3a4559"/><stop offset="100%" stop-color="#191f2b"/></linearGradient>
    <radialGradient id="stCore" cx="45%" cy="40%" r="55%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#6be5ff"/><stop offset="100%" stop-color="#1463a8"/></radialGradient>

  <rect x="92" y="56" width="54" height="14" rx="4" fill="url(#stIron)" stroke="#0d0a12" stroke-width="4.5"/>
  <rect x="92" y="74" width="54" height="14" rx="4" fill="url(#stIron)" stroke="#0d0a12" stroke-width="4.5"/>
  <rect x="136" y="52" width="14" height="40" rx="4" fill="url(#stBrass)" stroke="#0d0a12" stroke-width="4.5"/>
  <rect x="112" y="53" width="9" height="38" rx="2" fill="url(#stBrass)" stroke="#0d0a12" stroke-width="3.5"/>
